<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Friday · Pick a game</title>
<style>
:root{--bg:#07080d;--card:#11131c;--line:#22263a;--acc:#ffc04d;--text:#f2f4fa;--muted:#8b91a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,a{font:inherit;color:inherit}
/* menu */
.menu{position:absolute;inset:0;overflow-y:auto;padding:22px 16px 30px;background:radial-gradient(600px 300px at 50% -5%,rgba(255,192,77,.18),transparent 70%),var(--bg)}
.menu h1{font-size:30px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
.menu h1 span{color:var(--acc)}
.menu p.sub{color:var(--muted);margin-top:8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px;max-width:900px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card:hover{border-color:var(--c)}
.card .pv{height:110px;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),#0b0d14}
.card .tx{padding:10px 12px 14px}
.card b{display:block;font-size:16px;font-weight:800}
.card span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.card i{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--c);color:#111}
/* viewer */
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px calc(8px);background:#0b0d14;border-bottom:1px solid var(--line)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;cursor:pointer;text-decoration:none}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--c);border-color:var(--c);color:#111}
iframe{flex:1;width:100%;border:none;background:#000}
</style>
</head>
<body>
<section class="menu" id="menu">
  <h1>Black Friday<br><span>prank sites</span> 🎮</h1>
  <p class="sub">Pick a site — the prize is always GTA VI, then nickname, a level-47 profile and a decrypting key.</p>
  <div class="grid" id="grid"></div>
</section>
<section class="view" id="view">
  <div class="bar">
    <button class="ic" id="back" title="All sites">☰</button>
    <div class="tabs" id="tabs"></div>
    <a class="ic" id="full" title="Open full screen" target="_blank">↗</a>
  </div>
  <iframe id="frame" allow="clipboard-write; autoplay; fullscreen"></iframe>
</section>
<script>
const SITES = [
  {id:'games',   name:'Game Case',    desc:'Case opening roulette',          emoji:'📦', c:'#ffc04d'},
  {id:'wheel',   name:'Neon Wheel',   desc:'Spin the wheel',                 emoji:'🎡', c:'#c6ff3d'},
  {id:'scratch', name:'Scratch Card', desc:'Scratch it with your finger',    emoji:'🪙', c:'#ff5fa2'},
  {id:'slots',   name:'Match 3',      desc:'Lever machine with 3 reels',     emoji:'🎰', c:'#ff3da6'},
  {id:'claw',    name:'Claw Machine', desc:'Grab the prize with the claw',   emoji:'🕹️', c:'#ffd23f'},
  {id:'boxes',   name:'3 Boxes',      desc:'Watch the shuffle, pick a box',  emoji:'🎁', c:'#22e4ff'},
  {id:'plinko',  name:'Plinko',       desc:'Drop the ball',                  emoji:'🔮', c:'#7c4dff'},
];
const $ = id => document.getElementById(id);
$('grid').innerHTML = SITES.map((s, i) => `<button class="card" data-id="${s.id}" style="--c:${s.c}"><i>#${i + 1}</i><div class="pv">${s.emoji}</div><div class="tx"><b>${s.name}</b><span>${s.desc}</span></div></button>`).join('');
$('tabs').innerHTML = SITES.map(s => `<button class="tab" data-id="${s.id}" style="--c:${s.c}">${s.emoji} ${s.name}</button>`).join('');
function open(id){
  const s = SITES.find(x => x.id === id); if (!s) return showMenu();
  $('frame').src = s.id + '.html';
  $('full').href = s.id + '.html';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === id));
  const t = document.querySelector(`.tab[data-id="${id}"]`); if (t) t.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'});
  $('menu').style.display = 'none'; $('view').classList.add('on');
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
function showMenu(){ $('view').classList.remove('on'); $('menu').style.display = ''; $('frame').src = 'about:blank'; history.replaceState(null, '', location.pathname); }
document.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id); });
$('back').addEventListener('click', showMenu);
if (location.hash.length > 1) open(location.hash.slice(1));
</script>
</body>
</html>
